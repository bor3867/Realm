<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boss Sandbox</title>
<!--
=======================================================================================================================
MELON REALMS — BOSS SANDBOX  (built by tools/build_boss_sandbox.mjs from the game's own code and art; 2026-11-05)

WHAT THIS IS
  A self-contained copy of the game's boss engine (src/bossx.js) and of the parts of the game a boss fight touches, with
  the Hollow Court (the Jarls' Court room, the real layout) and the two Hollow Jarls running on their real code. Design
  and test boss fights here; whatever runs here drops into the game unchanged. Edit only the BOSS CODE section below
  (each boss is one block: "BOSS: <id>"). Everything else is the engine copy: leave it as it is.

THE CONTRACT (what a boss is)
  A boss is an object (the game's src/bosses/<id>.js, its `export default`) with:
    id, name, hp, def, r (body radius, tiles), thresholds [0.66, 0.30] (life fractions where phases 2 and 3 begin)
    phases: { 1: { move, patterns: [] }, 2: {...}, 3: {...} }    (move: the name of one of its own moves, below)
    choose(g, e)            the engine asks for the next pattern; return null to let a DIRECTOR (in update) run the fight
    update(g, e, dt)        every frame (its director: state, combos, timers). Keep its state in e.bx (e.g. e.bx.wd)
    moves: { name(g, e, dt) }   movement, called every frame with the phase's move
    specials: { name(g, e, V) } functions the timed queue may call: later(e, t, 'name', V) runs specials[name] t s on
    onWake, onPhase(g, e, ph), onDeath, posing(g,e) (true: it drives its own clip), charging(g,e) (true: its charge
    clip), immune(g,e), dmgMult(g,e), alpha(g,e), drawGround(r, g, e), draw(r, g, e), lights
  Its state: e.bx = { phase, state ('sleep'|'intro'|'fight'|'windup'|'release'|'recover'|'morph'|'grace'|'death'),
    vol (the timed queue), pvx/pvy (your velocity, smoothed), anim, def, dbg (what /bossdebug shows), leapZ (lift) }

THE CALLS A BOSS MAKES (g)
  g.bxShot(e, x, y, angle, V)  a shot. V: { sprite: 'sheet/name', size (hit radius, tiles), speed (tiles/s), range
                               (tiles), dmg, free (true: it leaves from (x,y) even inside the boss's body; otherwise
                               shots from the body start at its feet), life, mv: { hold, accel, max, curve, brake, re,
                               boomer, wave: {amp, freq}, split: {at, n, speed, range} } }
                               (mv rides with the shot and works online; NO homing: there are no seeking shots)
  g.fx.push({ kind: 'lane', x, y, a, len, w (half-width), delay, t: 0, life, dmg, every, spin, a0, tell, cols, by })
                               a line on the floor: told until delay, then it hurts while you stand in it (every s)
            { kind: 'zone', x, y, r, delay, t: 0, life, dmg, done: !dmg, colors, by }   a circle: told, then one blow
            { kind: 'cleave', x, y, a, r, spread, delay, t: 0, life, dmg, by }            a wedge: told, then one blow
            { kind: 'ring', x, y, t: 0, max, color }                                     a ring spreading (looks only)
  g.bxDmg(e, n)  its damage scaled;  g.hurtPlayer(dmg, by)  a blow that is no shot (a charge's body)
  g.float(x, y, text, color), g.banner(text, ms), g.vx({ k: 'burst'|'shake', ... }), g.sfx(name)
  g.addEnemy(id, x, y)  (its portals: 'wiz_portal');  g.moveCircle(e, dx, dy, r) moves round walls; isSolid(g.map, x, y)
  g.bxClearBullets(e), g.bxMorph(e), g.bxLog(e, ev, info), g.t (seconds), g.player, g.projectiles, g.enemies
  The shared helpers (src/bosses/kit.js): TAU, angleTo, target(g, e) (the nearest player), ahead(g, e, T), players(g),
  ring, fan, open. The court's (src/bosses/jarl_court.js): courtOf, courtTick, partner, enthroned, joinCourt.

RULES THE GAME HOLDS YOU TO (break them and it will not port)
  1. ONLINE the server runs the fight and sends what it makes. A shot cannot change course after it is fired except by
     its own V.mv (a returning shot: mv.boomer, or two shots). A telegraph that moves (a lane that follows you) must be
     drawn from the boss's own state (drawGround reading e.bx...), not by changing an fx after it was pushed.
  2. Timing in seconds, distance in tiles (16 screen px; a sprite pixel is 2 screen px). Damage: D(n) = n + 4, the
     numbers set against an endgame character (Defense 4 here, 750 Life). A player moves 7.6 tiles/s (speed 40).
  3. ONE tell per attack: one long, readable charge-up and one notification, then the attack. Never a second warning
     at the lock, never twitchy speeds (the Warrior charges at 11 tiles/s; 0.7 s between charges in a chain).
  4. Every attack dodgeable with the game's real movement and hitbox (your body: a capsule 0.26 to 0.66 tiles above
     your feet, radius 0.29). No untold damage, no pattern that closes every way out.
  5. Each boss its own director: its own movement, its own pools by phase, its own mechanics. Phases must change at
     least two things (movement, arena control, geometry, sources, hazards, summons, positioning, stagger...).
  6. No white hit-flash on the boss, no screen flash when you are hit. Small, crisp pixel art; nothing oversized.
  7. Shots leave from the boss's feet (V.free only for a source of its own: a portal, a rune, a sun).
  8. No seeking / homing shots.

HOW TO TEST HERE
  WASD to move, the mouse to aim (you fire while the mouse is held, or with Auto-fire on). The buttons: restart the
  court, either Jarl alone, kill the Warrior (the Mage comes down), skip to the next phase, God mode, slow motion.
  The debug panel shows each boss's phase, state, combination, movement and timers; the log shows its choices.
  The 'measure' readout counts damage you took in the last minute and how much of the time the boss moves.
=======================================================================================================================
-->
<style>
  :root { --bg: #0d0a12; --panel: #17121f; --line: #3a2f4a; --text: #e6dff0; --dim: #a69bb8; --gold: #ffd650; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; display: flex; gap: 12px; padding: 12px; flex-wrap: wrap; }
  #wrap { position: relative; }
  canvas { display: block; background: #08060c; image-rendering: pixelated; border: 1px solid var(--line); cursor: crosshair; }
  #side { width: 360px; max-width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .box { background: var(--panel); border: 1px solid var(--line); padding: 8px; border-radius: 4px; }
  .box h3 { margin: 0 0 6px; font-size: 12px; color: var(--gold); letter-spacing: .05em; text-transform: uppercase; }
  button, select, input { background: #241c30; color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #log { height: 220px; overflow: auto; font: 11px/1.35 ui-monospace, monospace; color: var(--dim); white-space: pre; }
  #dbg { font: 11px/1.4 ui-monospace, monospace; white-space: pre; }
  label { color: var(--dim); }
  details summary { cursor: pointer; color: var(--gold); }
  #rules { font: 11px/1.45 ui-monospace, monospace; white-space: pre-wrap; color: var(--dim); max-height: 300px; overflow: auto; }

<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="side">
  <div class="box"><h3>Fight</h3>
    <div class="row">
      <button id="bCourt">Restart court (both)</button><button id="bW">Warrior alone</button><button id="bZ">Mage alone</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button id="bKillW">Kill Warrior</button><button id="bNext">Next phase</button><button id="bPause">Pause</button>
    </div>
    <div class="row" style="margin-top:6px">
      <label><input type="checkbox" id="god"> God mode</label>
      <label><input type="checkbox" id="auto" checked> Auto-fire</label>
      <label><input type="checkbox" id="hb"> Hitboxes</label>
    </div>
    <div class="row" style="margin-top:6px">
      <label>Speed <select id="spd"><option value="1">1x</option><option value="0.5">0.5x</option><option value="0.25">0.25x</option></select></label>
      <label>Your DPS <input id="dps" type="number" value="2600" style="width:80px"></label>
    </div>
  </div>
  <div class="box"><h3>Bosses</h3><div id="dbg"></div></div>
  <div class="box"><h3>Log</h3><div id="log"></div></div>
  <div class="box"><details><summary>Rules &amp; the contract</summary><div id="rules"></div></details></div>
</div>
<script>
// =====================================================================================================================
// MELON REALMS — BOSS SANDBOX ENGINE (a faithful subset of src/bossx.js and the parts of src/game.js a boss fight touches)
// Same names, same fields, same rules as the game: a boss written against this drops into the game unchanged.
// See the RULES panel / comment at the top of the page for the contract.
// =====================================================================================================================
const TS = 16;                                   // screen pixels per tile (a sprite pixel is 2 screen pixels: 8 to a tile)
const TAU_ = Math.PI * 2;
const HITBOX = { foot: 0.26, head: 0.66, r: 0.29 };   // your body: a capsule from 0.26 to 0.66 tiles up from your feet, radius 0.29
const moveSpeed = (spd) => 3.6 + 5.0 * (spd / 50);    // tiles a second (stats top out at 50)
const mitigate = (dmg, def) => Math.max(Math.round(dmg * 0.15), dmg - def);
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);
function isSolid(m, x, y) { const xi = Math.floor(x), yi = Math.floor(y); if (xi < 0 || yi < 0 || xi >= m.w || yi >= m.h) return true; return m.solid[yi * m.w + xi] === 1; }
function segDist(ax, ay, bx, by, px, py) { const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy || 1, t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L)); return Math.hypot(ax + dx * t - px, ay + dy * t - py); }

// ---------------------------------------------------------------- sprites (the game's own atlases, embedded by the build)
const SPRITES = {};                              // 'sheet/name' -> { img, frames: {fn: [x,y,w,h]}, anims, phases, death, size, foot }
function loadSprites(ATLASES) {
  const jobs = [];
  for (const A of ATLASES) {
    const img = new Image(); img.src = A.png; jobs.push(new Promise((res) => { img.onload = res; img.onerror = res; }));
    for (const [sheet, S] of Object.entries(A.sheets)) for (const [name, sp] of Object.entries(S.sprites)) {
      let w = 0, h = 0; for (const f of Object.values(sp.frames)) { w = Math.max(w, f[2]); h = Math.max(h, f[3]); }
      SPRITES[`${sheet}/${name}`] = { img, frames: sp.frames, anims: sp.anims || { loop: { frames: Object.keys(sp.frames), fps: 8, loop: true } }, phases: sp.phases, death: sp.death, size: [w, h], foot: S.kind === 'boss' ? [w / 2, h - 1] : [w / 2, h / 2], kind: S.kind };
    }
  }
  return Promise.all(jobs);
}
class Anim {                                      // a clip player, as src/anim.js: play(clip, {speed}), frame, i, done, 'ended'
  constructor(def, clip) { this.def = def; this.cb = []; this.play(clip); }
  on(ev, f) { this.cb.push(f); }
  play(clip, o = {}) { const A = this.def.anims[clip]; if (!A) return; this.clip = clip; this.A = A; this.i = 0; this.t = 0; this.speed = o.speed ?? 1; this.done = false; this.frame = A.frames[0]; }
  update(dt) {
    if (!this.A || this.done) return;
    this.t += dt * this.speed * (this.A.fps || 8);
    while (this.t >= 1) { this.t -= 1; this.i++; if (this.i >= this.A.frames.length) { if (this.A.loop) this.i = 0; else { this.i = this.A.frames.length - 1; this.done = true; const c = this.clip; for (const f of this.cb) f(c); break; } } }
    this.frame = this.A.frames[this.i];
  }
}

// ---------------------------------------------------------------- the game a boss sees (g)
class Game {
  constructor(room) {
    this.t = 0; this.map = room.map; this.room = room;
    this.player = { x: room.start[0], y: room.start[1], hp: 750, maxHp: 750, def: 4, spd: 40, dead: false, status: {} };
    this.enemies = []; this.projectiles = []; this.fx = []; this.parts = []; this.floats = []; this.bannerList = []; this.notable = [];
    this.bxLogs = []; this.bxDebug = true; this.god = false; this.shake = 0; this.dmgTaken = []; this.camAngle = 0;
  }
  // ---- what a boss calls
  bxDmg(e, d) { return Math.round((d || 60) * ((e.bx && e.bx.B.dmgScale) || 1)); }
  up(x, y, h) { return [x, y - h]; }                     // (the camera here never turns: 'up' the screen is -y)
  bxShot(e, x, y, a, V, extra) {
    if (e.dead || (e.bx && ['death', 'deathhold', 'gone'].includes(e.bx.state))) return { x, y, vx: 0, vy: 0, a, life: 0, dmg: 0, dead: true };
    { const S = e.bx, def = S && S.def, K = (S && S.drawK) || 1;   // (a shot set off anywhere inside the boss's drawn body starts at its feet, unless V.free)
      const H = def ? (def.size[1] * 2 * K) / 16 : 3, W2 = def ? (def.size[0] * K) / 16 : 1.5, h = -(y - e.y), w = x - e.x;
      if (!V.free && h > -0.6 && h < H + 0.6 && Math.abs(w) < W2 + 0.6) { x = e.x; y = e.y; } }
    const sp = V.speed || 5, b = { from: 'e', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, a, life: (V.range || 14) / Math.max(0.01, sp), dmg: this.bxDmg(e, V.dmg || 60), sprite: V.sprite, r: V.size || 0.45, by: e.D.name, bxOf: e };
    if (V.mv) b.mv = { ...V.mv }; if (V.life) b.life = V.life;
    if (extra) Object.assign(b, extra);
    this.projectiles.push(b); return b;
  }
  hurtPlayer(dmg, by) {
    const p = this.player; if (p.dead || p.status.invuln > 0) return;
    const d = mitigate(dmg, p.def); this.dmgTaken.push([this.t, d]);
    this.float(p.x, p.y - 1, '-' + d, '#ff5a5a'); if (this.god) return;
    p.hp -= d; if (p.hp <= 0) { p.hp = 0; p.dead = true; this.banner('YOU DIED · ' + by, 2500); }
  }
  float(x, y, text, color) { this.floats.push({ x, y, text, color, t: 0 }); }
  banner(text, ms = 1500) { this.bannerList.push({ text, until: performance.now() + ms }); if (this.bannerList.length > 3) this.bannerList.shift(); }
  vx(o) { if (o.k === 'shake') this.shake = Math.max(this.shake, o.amt || 3); else if (o.k === 'burst') for (let i = 0; i < Math.min(30, o.n || 4); i++) this.parts.push({ x: o.x, y: o.y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4 - 1, t: 0, life: 0.5 + Math.random() * 0.4, c: (o.colors || ['#fff'])[i % (o.colors || ['#fff']).length] }); }
  sfx() {}
  addEnemy(id, x, y) { const D = ENEMY_DEFS[id]; const e = { id, D: { ...D, id }, x, y, hp: D.hp, maxHp: D.hp, r: D.r || 0.6, dead: false }; this.enemies.push(e); return e; }
  blockedAt(x, y, r) { return isSolid(this.map, x, y) || isSolid(this.map, x + r, y) || isSolid(this.map, x - r, y) || isSolid(this.map, x, y + r) || isSolid(this.map, x, y - r); }
  moveCircle(o, dx, dy, r = 0.4) {                       // slide along walls: each axis on its own
    if (!this.blockedAt(o.x + dx, o.y, r * 0.75)) o.x += dx;
    if (!this.blockedAt(o.x, o.y + dy, r * 0.75)) o.y += dy;
  }
  bxClearBullets(e) { this.projectiles = this.projectiles.filter((b) => !(b.bxOf === e || (b.from === 'e' && b.by === e.D.name))); }
  bxLog(e, ev, info) {
    if (!this.bxDebug) return; const S = e.bx || {}, d = S.dbg || {};
    this.bxLogs.push({ t: +this.t.toFixed(2), boss: e.D.name, phase: S.phase, state: S.state, dir: d.st, combo: d.combo || (S.pat && S.pat.name), move: d.move, ev, info, shots: this.projectiles.filter((b) => b.bxOf === e).length, portals: this.enemies.filter((q) => !q.dead && q.id === 'wiz_portal').length });
    if (this.bxLogs.length > 400) this.bxLogs.shift();
  }
  damageEnemy(e, d) {                                    // your shots (and the test buttons)
    if (e.dead) return;
    if (e.bx) { if (this.bxImmune(e, e.x, e.y - 2)) return; d = mitigate(d, e.D.def || 0); d = this.bxClamp(e, d); e.hp -= d; this.float(e.x, e.y - 3, String(d), '#ffffff'); return; }
    e.hp -= mitigate(d, e.D.def || 0); if (e.hp <= 0) { e.dead = true; this.vx({ k: 'burst', x: e.x, y: e.y, n: 14, colors: ['#e6c8ff', '#ffffff'] }); }
  }
  // ---- the boss engine (src/bossx.js), the parts a fight runs on
  bxSetup(e) {
    const B = BOSSES[e.D.bx], art = B.art || e.D.bx, def = SPRITES[`bx_${art}/${art}`];
    const S = (e.bx = { B, def, phase: 1, state: 'sleep', t: 0, pat: null, patIdx: 0, vol: [], wait: 1.6, anim: def ? new Anim(def, def.phases['1'].idle) : null, hurtT: 0, flashT: 0, arena: e.room || null });
    e.hitUp = def ? Math.max(0.5, (def.foot[1] - def.size[1] / 2) / 8 * (B.drawScale || 1)) : 1.4;
    if (B.drawScale) S.drawK = B.drawScale;
    if (S.anim) S.anim.on('ended', (clip) => this.bxClipEnded(e, clip));
    return S;
  }
  bxPhaseData(e) { return e.bx.B.phases[e.bx.phase]; }
  bxThresholds(e) { return e.bx.B.thresholds || [0.66, 0.33]; }
  updateBx(e, dt) {
    const S = e.bx || this.bxSetup(e), p = this.player, B = S.B;
    S.t += dt; S.hurtT = Math.max(0, S.hurtT - dt);
    if (e.invulnT > 0 && e.invulnT < 50) e.invulnT = Math.max(0, e.invulnT - dt);
    if (S.anim) S.anim.update(dt);
    if (S.state === 'gone') return;
    if (dt > 0) { const vx = S.plx === undefined ? 0 : (p.x - S.plx) / dt, vy = S.ply === undefined ? 0 : (p.y - S.ply) / dt, k = Math.min(1, dt * 6), jump = Math.hypot(vx, vy) > 30;
      S.pvx = jump ? 0 : (S.pvx || 0) + (vx - (S.pvx || 0)) * k; S.pvy = jump ? 0 : (S.pvy || 0) + (vy - (S.pvy || 0)) * k; S.plx = p.x; S.ply = p.y; }
    if (S.state === 'sleep') { const R0 = e.room; if (!R0 || (p.x > R0.x && p.x < R0.x + R0.w && p.y > R0.y && p.y < R0.y + R0.h)) this.bxWake(e); return; }
    if (S.state === 'deathhold') { S.wait -= dt; if (S.wait <= 0) this.bxFinish(e); return; }
    if (B.update) B.update(this, e, dt);
    if (S.state === 'death') S.vol = [];
    for (const v of S.vol) if ((v.t -= dt) <= 0 && !v.done) { v.done = true; this.bxVolley(e, v.V); }
    S.vol = S.vol.filter((v) => !v.done);
    if (S.state === 'intro') { if ((S.wait -= dt) <= 0) { S.state = 'fight'; S.wait = 0.6; } return; }
    if (S.state === 'morph' || S.state === 'death') return;
    if (S.state !== 'grace' && !p.dead) this.bxPressure(e, dt);
    if (S.state === 'grace') { this.bxMove(e, dt, 'hold'); this.bxPose(e, dt); if ((S.wait -= dt) <= 0) { S.state = 'fight'; S.wait = 0.2; } return; }
    const PH = this.bxPhaseData(e);
    this.bxMove(e, dt, (S.pat && S.pat.move) || PH.move || 'pace');
    this.bxPose(e, dt);
    if (S.state === 'windup') { if ((S.wait -= dt) <= 0) { S.state = 'release'; if (S.anim) S.anim.speed = 1; } return; }
    if (S.state === 'release' && !S.fired && S.anim && S.anim.i >= 1) this.bxRelease(e);
    if (S.state === 'release' || S.state === 'recover') { if (S.state === 'recover' && (S.wait -= dt) <= 0) { S.state = 'fight'; S.pat = null; } return; }
    if ((S.wait -= dt) > 0 || p.dead) return;
    this.bxStartPattern(e);
  }
  bxPose(e, dt) {
    const S = e.bx, A = S.anim, P = S.def && S.def.phases[S.phase];
    if (!A || !P || S.state === 'windup' || S.state === 'release') return;
    if (S.B.posing && S.B.posing(this, e)) return;
    const sp = Math.hypot(e.x - (S.px ?? e.x), e.y - (S.py ?? e.y)) / Math.max(dt, 1e-3); S.px = e.x; S.py = e.y;
    S.spd = (S.spd || 0) + (Math.min(sp, 20) - (S.spd || 0)) * Math.min(1, dt * 8);
    const charging = S.B.charging && S.B.charging(this, e);
    const want = S.flinch > this.t && P.hurt ? P.hurt : charging && P.charge ? P.charge : S.spd > 0.6 && P.walk ? P.walk : P.idle;
    const mine = [P.idle, P.walk, P.charge, P.hurt];
    if (A.clip === want) { if (want === P.walk) A.speed = Math.max(0.6, Math.min(1.8, S.spd / (S.B.walkPace || 2.5))); return; }
    if (mine.includes(A.clip) || A.done) A.play(want, { speed: want === P.walk ? Math.max(0.6, Math.min(1.8, S.spd / (S.B.walkPace || 2.5))) : 1 });
  }
  bxWake(e) { const S = e.bx; e.state = 'idle'; S.state = 'intro'; S.wait = 1.6; this.banner(e.D.name.toUpperCase(), 2000); this.vx({ k: 'shake', amt: 5 }); if (S.B.onWake) S.B.onWake(this, e); }
  bxStartPattern(e) {
    const S = e.bx, PH = this.bxPhaseData(e), list = PH.patterns || [];
    const pat = S.B.choose ? S.B.choose(this, e, list) : list[S.patIdx++ % list.length];
    if (!pat) { S.wait = 0.12; return; }
    S.pat = pat; S.fired = false; this.bxLog(e, 'pattern', pat.name);
    if (pat.special && S.B.specials[pat.special] && pat.instant) { S.B.specials[pat.special](this, e, pat, null); S.state = 'recover'; S.wait = (pat.recover || 0.4) * (S.B.tempo || 1); return; }
    S.state = 'windup'; S.wait = Math.max(0.45, (pat.windup || 0.6) * (S.B.tempo || 1) * (S.tempoK || 1));
    if (S.anim) { S.anim.play(S.def.phases[S.phase].attack); S.anim.speed = 0; }

//   PHASE III  THE DEATH HUNT    he hunts (5 t/s, turning hard but not snapping); chains fall across the court every
//                                6.5 s (marked lanes); DEATH HUNT (7 s of the hunt at 5.6, an axe fan every 1.2 s, two
//                                short charges; then spent: STAGGERED); THE EXECUTION (his signature: three leaps onto you,
//                                each landing a ring of stone, then a great slam and its rings; then spent: STAGGERED);
//                                CHAINED CHARGES (three); the walking AXE STORM (four arms); EXECUTIONER'S LEAP
//
// Every attack is told once and readably (the user, 2026-11-04: "a long charge up with notification and then he should
// charge"): a charge's one lane following you then held; a leap's landing ring; a slam's circle; a sweep's wedge.
// Damage numbers are effective ones (D(n): set above a Throne-geared character's Defense).
// Debug: /bossdebug shows his state, combination, movement and timers over him (e.bx.dbg) and logs his choices.
// Art: tools/build_jarl_warrior.py ('bx_jarl_warrior', 'jarl_shots/<name>').

const FIRE = ['#ff8a1f', '#ffd650', '#ff3a1a'], ASH = ['#5a5560', '#8a8490', '#b884cc'];
const RED = ['#ff6a1c', '#ff6a1c', '#ff3a1a', '#ffffff'], EMBER = ['#ff8a1f', '#ff8a1f', '#ffd650', '#ffffff'], CHAIN = ['#8a8490', '#8a8490', '#c8c0d8', '#ffffff'];
const D = (n) => n + 4;
const deg = (d) => (d * Math.PI) / 180;
const CHARGE_V = 11, TELL = 1.1, TRACK = 0.7;
const later = (e, t, name, V = {}) => e.bx.vol.push({ t, V: { form: 'special', ...V, name } });   // (its own name last)
const shot = (g, e, x, y, a, V) => g.bxShot(e, x, y, a, V);
const CRESCENT = { sprite: 'jarl_shots/crescent', size: 0.4 }, STONE = { sprite: 'jarl_shots/stone', size: 0.4 }, AXE = { sprite: 'jarl_shots/sword', size: 0.45 };
const zone = (g, e, x, y, r, delay, dmg, cols = FIRE) => g.fx.push({ kind: 'zone', src: null, x, y, r, t: 0, delay, life: delay + 0.15, dmg: dmg ? g.bxDmg(e, dmg) : 0, by: e.D.name, done: !dmg, colors: cols });
const cleave = (g, e, a, r, spread, delay, dmg) => g.fx.push({ kind: 'cleave', x: e.x, y: e.y, a, r, spread, delay, t: 0, life: delay + 0.3, dmg: dmg ? g.bxDmg(e, dmg) : 0, by: e.D.name, done: !dmg });
const court = (e) => e.room || { x: Math.floor(e.x) - 20, y: Math.floor(e.y) - 20, w: 40, h: 34 };
const bearing = (g, e) => { const q = target(g, e); return angleTo(e.x, e.y, q.x, q.y); };
const range = (g, e) => { const q = target(g, e); return Math.hypot(q.x - e.x, q.y - e.y); };
const swish = (g) => { g.sfx('shatter'); g.vx({ k: 'shake', amt: 3 }); };
function reach(g, e, a, want) {                            // how far he can go that way: in the court and short of its walls
  const H = court(e), M = g.map, solid = (x, y) => isSolid(M, x, y) || isSolid(M, x + 0.9, y) || isSolid(M, x - 0.9, y) || isSolid(M, x, y + 0.9) || isSolid(M, x, y - 0.9);
  let L = 0;
  while (L + 0.25 <= want) { const x = e.x + Math.cos(a) * (L + 0.25), y = e.y + Math.sin(a) * (L + 0.25); if (!(x > H.x + 1.6 && x < H.x + H.w - 1.6 && y > H.y + 1.6 && y < H.y + H.h - 1.6) || solid(x, y)) break; L += 0.25; }
  return Math.max(0.5, L);
}
function landing(g, e, x, y) {                             // a place he can land: on the floor, in the court (drawn in toward him till it is)
  const H = court(e); x = Math.max(H.x + 2, Math.min(H.x + H.w - 2, x)); y = Math.max(H.y + 2, Math.min(H.y + H.h - 2, y));
  for (let k = 0; k < 20 && (isSolid(g.map, x, y) || isSolid(g.map, x + 1, y) || isSolid(g.map, x - 1, y) || isSolid(g.map, x, y + 1) || isSolid(g.map, x, y - 1)); k++) { x += (e.x - x) * 0.15; y += (e.y - y) * 0.15; }
  return [x, y];
}
const lead = (g, e, T) => { const q = target(g, e); return [q.x + (e.bx.pvx || 0) * T, q.y + (e.bx.pvy || 0) * T]; };

// ================================================================ the phases (each its own movement, pool and mechanics)
const PHASE = {
  1: { title: 'THE HUNT', walk: 4.2, move: 'chase', breath: 1.0, pool: { chargeSlam: 3, reap: 2, ground: 2, axes: 2 }, closer: 'chargeSlam' },
  2: { title: 'THE EXECUTIONER', walk: 4.4, move: 'stalk', breath: 0.8, pool: { chain: 3, leap: 3, reapFire: 2, stormWalk: 2, axes: 1 }, closer: 'leap', fan: 1.8, embers: true },
  3: { title: 'THE DEATH HUNT', walk: 5.0, move: 'hunt', breath: 0.55, pool: { hunt: 3, execution: 2, chain: 2, stormWalk: 1, leap: 2 }, closer: 'chain', embers: true, chains: 6.5 },
};
const NEAR = { reap: 1, reapFire: 1, ground: 1, stormWalk: 1 }, FAR = { chargeSlam: 1, chain: 1, leap: 1, hunt: 1 };

// ================================================================ the director
const W0 = (g) => ({ st: 'pursue', until: g.t + 1.2, combo: null, hist: [], still: 0, far: 0, mv: null, mvUntil: 0, fanAt: g.t + 2, emberAt: 0, chainAt: g.t + 4, poseUntil: 0 });
const W = (g, e) => e.bx.wd || (e.bx.wd = W0(g));
function setMove(g, e, mode, t) { const w = W(g, e); w.mv = mode; w.mvUntil = g.t + t; }
function done(g, e, rec = 0.6, recMove = 'hold') {           // a combination finished: a breath, then the hunt again
  const w = W(g, e); w.st = 'recover'; w.until = g.t + rec; setMove(g, e, recMove, rec); log(g, e, 'recover', rec);
}
function stagger(g, e, t, say) {                              // he reels (earned): open to you a third more
  const S = e.bx, w = W(g, e);
  S.vol = []; w.dash = null; w.tell = null; w.hunt = null; w.storm = null; S.leapZ = 0;
  w.st = 'stagger'; w.until = g.t + t; setMove(g, e, 'hold', t); S.jwStag = g.t + t; S.flinch = g.t + t; S.flinchNext = g.t + t + 0.6;
  if (say) { if (g.banner) g.banner(say, 1400); g.float(e.x, e.y - 3, 'STAGGERED', '#ffd650', e); }
  log(g, e, 'stagger', t);
}
function log(g, e, ev, info) { if (g.bxLog) g.bxLog(e, ev, info); }
function pick(g, e) {
  const S = e.bx, w = W(g, e), P = PHASE[S.phase] || PHASE[3], d = range(g, e);
  if (S.jwCall) { S.jwCall = false; return P.pool.chain ? 'chain' : 'chargeSlam'; }   // (the Mage's Spectral Crossfire: a charge with it)
  if (w.still > 1.8) { w.still = 0; return 'pounce'; }         // (you stood still: he leaps onto you)
  if (w.far > 2) { w.far = 0; return P.closer; }               // (you hung far off: he closes)
  const L = Object.entries(P.pool).filter(([k]) => !w.hist.slice(-2).includes(k));
  const wt = L.map(([k, v]) => v * (d < 6 && NEAR[k] ? 1.8 : d > 8 && FAR[k] ? 1.8 : d > 8 && NEAR[k] ? 0.35 : 1));
  let r = Math.random() * wt.reduce((a, b) => a + b, 0);
  for (let i = 0; i < L.length; i++) if ((r -= wt[i]) <= 0) return L[i][0];
  return L.length ? L[L.length - 1][0] : 'chargeSlam';
}
function director(g, e, dt) {

  if (w.st === 'combo' && g.t >= w.until) done(g, e);           // (a combination that ran past its own end)
  if ((w.st === 'recover' || w.st === 'stagger') && g.t >= w.until) { w.st = 'pursue'; w.until = g.t + P.breath; w.combo = null; S.jwStag = 0; log(g, e, 'pursue', P.move); }
  if (w.st === 'pursue') {

    if (d > 7 && g.t >= (w.axeAt || 0)) { w.axeAt = g.t + 2.2; axeThrow(g, e, { last: false }); }   // (you kite him at range: his axe after you, turning back to him)
    if (g.t >= w.until) {
      const c = pick(g, e); w.combo = c; w.hist.push(c); if (w.hist.length > 6) w.hist.shift();
      w.st = 'combo'; w.until = g.t + 30; log(g, e, 'combo', c); COMBO[c](g, e);

  if (P.chains && g.t >= w.chainAt) { w.chainAt = g.t + P.chains; fallingChains(g, e); }
  S.dbg = { st: w.st, combo: w.combo, move: mode(g, e), next: Math.max(0, w.until - g.t).toFixed(1), still: w.still.toFixed(1), far: w.far.toFixed(1), phase: P.title };

const mode = (g, e) => {                                      // how he moves this moment: a dash's own; planted through a tell; a combination's; the hunt; his phase's pursuit
  const w = W(g, e); if (w.dash) return w.dash.kind; if (w.tell || w.prep > g.t) return 'hold';
  if (w.mvUntil > g.t && w.mv) return w.mv; if (w.hunt && g.t < w.hunt.until) return 'hunt';

// ================================================================ the combinations
// a charge: ONE tell (the '!', his roar, his stance; one lane following you, then held), then the charge
function chargeMark(g, e, V) {
  const w = W(g, e), a = bearing(g, e), T = V.tell || ((e.bx.phase || 1) >= 3 ? 0.9 : TELL);   // (III: shorter, still one and readable)
  g.float(e.x, e.y - 3.2, '!', '#ff3a1a', e); g.sfx('roar'); g.vx({ k: 'shake', amt: 2 });
  g.vx({ k: 'burst', x: e.x, y: e.y - 0.4, n: 12, colors: ['#ff3a1a', '#ff8a1f', '#5a5560'] });
  w.tell = { a, len: reach(g, e, a, 10), k: 0, held: false, t0: g.t, T };
  e.bx.jwTell = w.tell; w.mvUntil = 0;
  later(e, T, 'chargeGo', V);
}
function tellTick(g, e) {
  const w = W(g, e), T = w.tell; if (!T) return;
  const k = Math.min(1, (g.t - T.t0) / T.T); T.k = Math.round(k * 20) / 20;
  if (g.t - T.t0 < T.T * (TRACK / TELL)) { const [lx, ly] = lead(g, e, 0.35), want = Math.min(10, Math.hypot(lx - e.x, ly - e.y) + 2.5); T.a = angleTo(e.x, e.y, lx, ly); T.len = reach(g, e, T.a, want); } else T.held = true;   // (at where you will be: the lane shows it)
}
function chargeGo(g, e, V) {

  const [lx, ly] = lead(g, e, 0.2), a = T ? T.a : bearing(g, e), want = V.short ? 4 : Math.min(10, Math.hypot(lx - e.x, ly - e.y) + 2.5), L = reach(g, e, a, want);
  w.dash = { kind: 'charge', x0: e.x, y0: e.y, x1: e.x + Math.cos(a) * L, y1: e.y + Math.sin(a) * L, at: g.t, until: g.t + L / CHARGE_V, a, dmg: D(175), hit: false, crash: L < want - 2, V, next: g.t };   // (a wall stops him only if it cut his charge well short: baited into it, earned)

}
function chargeEnd(g, e, C) {

  if (C.crash) { stagger(g, e, 1.6, 'THE JARL STAGGERS'); g.vx({ k: 'shake', amt: 9 }); g.vx({ k: 'burst', x: e.x, y: e.y, n: 30, colors: ASH }); g.sfx('hammer'); return; }
  const V = C.V;
  if (V.left > 0) { stoneBurst(g, e, 8); later(e, 0.7, 'chargeMark', { ...V, left: V.left - 1 }); setMove(g, e, 'hold', 0.7); return; }   // (a burst of stone where each stops; a breath; the next)
  if (V.then === 'slam') { slamMark(g, e, { r: 2.6, delay: 0.55, dmg: 190, rings: 1, rec: V.rec }); return; }

}
const stoneBurst = (g, e, n) => { for (let k = 0; k < n; k++) shot(g, e, e.x, e.y, bearing(g, e) + (k / n) * TAU, { ...STONE, speed: 4.4, range: 9, dmg: D(90) }); g.vx({ k: 'shake', amt: 4 }); };
// a slam: its circle told, then the blow, rings of stone out of it (their opening off to your side, turning ring by ring)
function slamMark(g, e, V) {
  const w = W(g, e); setMove(g, e, 'hold', V.delay + 0.25);
  zone(g, e, e.x, e.y, V.r, V.delay, D(V.dmg));
  w.poseUntil = g.t + V.delay + 0.3; e.bx.anim && e.bx.anim.play(e.bx.def.phases[e.bx.phase].attack);
  later(e, V.delay, 'slamHit', V);
}
function slamHit(g, e, V) {
  g.vx({ k: 'shake', amt: 7 }); g.sfx('hammer'); g.vx({ k: 'burst', x: e.x, y: e.y, n: 24, colors: ASH });
  const gap0 = bearing(g, e) + deg(90) * (Math.random() < 0.5 ? 1 : -1);
  for (let r = 0; r < (V.rings || 1); r++) later(e, r * 0.4, 'stoneRing', { gap: gap0 + r * deg(40), n: 18, speed: 4.6 });
  if (V.spiral) for (let k = 0; k < V.spiral; k++) later(e, k * 0.05, 'spiralOut', { a: bearing(g, e) + k * deg(29), k });
  if (V.stagger) { later(e, 0.2 + (V.rings || 1) * 0.4, 'staggerAfter', { t: V.stagger }); return; }

function stoneRing(g, e, V) {

}
function spiralOut(g, e, V) { for (const o of [0, Math.PI]) shot(g, e, e.x, e.y, V.a + o, { ...CRESCENT, speed: 5.2, range: 12, dmg: D(95) }); }
function staggerAfter(g, e, V) { stagger(g, e, V.t, 'THE JARL IS SPENT'); }

const COMBO = {
  // CHARGE & SLAM (I): one charge, a slam where it ends
  chargeSlam(g, e) { chargeMark(g, e, { left: 0, then: 'slam', rec: 0.7 }); },
  // CHAINED CHARGES (II two, III three): a breath between, a slam at the end
  chain(g, e) { chargeMark(g, e, { left: (e.bx.phase || 1) >= 3 ? 2 : 1, then: 'slam', rec: 0.6 }); },
  // REAPING ADVANCE (I): three sweeps as he walks you down, left of you, right of you, through you
  reap(g, e) { setMove(g, e, 'advance', 2.4); for (let i = 0; i < 3; i++) later(e, i * 0.75, 'reapMark', { s: [-28, 28, 0][i], fire: false, last: i === 2 }); },
  reapFire(g, e) { setMove(g, e, 'advance', 2.4); for (let i = 0; i < 3; i++) later(e, i * 0.75, 'reapMark', { s: [-28, 28, 0][i], fire: true, last: i === 2 }); },
  // GROUNDBREAKER (I): a slam, three rings, their openings turning
  ground(g, e) { slamMark(g, e, { r: 2.4, delay: 0.9, dmg: 200, rings: 3, rec: 0.6 }); },
  // AXE TOSS (I, II): axes thrown as he chases, each turning back to him at the end of its flight
  axes(g, e) { setMove(g, e, 'chase-slow', 2.4); for (let i = 0; i < 3; i++) later(e, 0.3 + i * 0.6, 'axeThrow', { last: i === 2 }); },
  // EXECUTIONER'S LEAP (II, III; a POUNCE when you stand still): onto where you will be
  leap(g, e) { leapMark(g, e, { ...lead(g, e, 0.9), spiral: 16, embers: (e.bx.phase || 1) >= 2, rec: 0.7 }); },
  pounce(g, e) { const q = target(g, e); if (g.banner) g.banner('DO NOT STAND STILL.', 1000); leapMark(g, e, { 0: q.x, 1: q.y, spiral: 8, embers: false, rec: 0.6, tell: 0.9 }); },
  // AXE STORM, walking (II three arms, III four): he turns his axe round him, walking you down; a ring as he stops
  stormWalk(g, e) {
    const w = W(g, e), n = (e.bx.phase || 1) >= 3 ? 4 : 3;
    zone(g, e, e.x, e.y, 2.2, 0.6, 0); if (g.banner) g.banner('THE AXE STORM', 1000); g.sfx('roar');
    w.storm = { a0: Math.random() * TAU, dir: (w.sd = -(w.sd || 1)), n, t0: g.t + 0.6, until: g.t + 4.2, next: g.t + 0.6 };
    setMove(g, e, 'hold', 0.6); later(e, 0.6, 'moveSet', { mv: 'advance-slow', t: 3.6 });
  },
  // DEATH HUNT (III): 7 s hunting you, an axe fan every 1.2 s, two short charges; then spent
  hunt(g, e) {
    const w = W(g, e); if (g.banner) g.banner('YOU CANNOT RUN.', 1400); g.sfx('roar');
    w.hunt = { at: g.t + 0.5, until: g.t + 7.5, a: bearing(g, e) }; setMove(g, e, 'hunt', 7.5);
    for (let t = 1.7; t < 7.5; t += 1.2) later(e, t, 'huntFan');
    for (const t of [2.4, 5.0]) later(e, t, 'chargeMark', { left: 0, then: 'none', short: true, tell: 0.8, done: false });
    later(e, 7.6, 'huntSpent');
  },
  // THE EXECUTION (III, his signature): three leaps onto you, then a great slam; then spent
  execution(g, e) {
    if (g.banner) g.banner('THE EXECUTION', 1800); g.sfx('roar'); g.vx({ k: 'shake', amt: 5 });
    later(e, 0.4, 'execLeap', { k: 0 });
  },
};
// a sweep: its wedge told 0.55 s; then the cut close (170) and an arc of nine crescents (95); aflame, embers along the arc
function reapMark(g, e, V) { const a = bearing(g, e) + deg(V.s); cleave(g, e, a, 2.6, deg(150), 0.55, D(170)); later(e, 0.55, 'reapCut', { ...V, a }); }
function reapCut(g, e, V) {
  for (let k = 0; k < 9; k++) shot(g, e, e.x, e.y, V.a + (k / 8 - 0.5) * deg(110), { ...CRESCENT, speed: 6, range: 11, dmg: D(95) });
  if (V.fire) for (const o of [-0.7, 0, 0.7]) zone(g, e, e.x + Math.cos(V.a + o) * 3, e.y + Math.sin(V.a + o) * 3, 1.1, 0.9, D(120), EMBER);
  swish(g); w0pose(g, e, 0.3);
  if (V.last) done(g, e, 0.5, 'hold');
}
const w0pose = (g, e, t) => { W(g, e).poseUntil = g.t + t; e.bx.anim && e.bx.anim.play(e.bx.def.phases[e.bx.phase].attack); };
// an axe: out to where you will be, and at the end of its flight, back to him (two shots: the turn made where it is)
function axeThrow(g, e, V) {
  const [tx, ty] = lead(g, e, 0.5), a = angleTo(e.x, e.y, tx, ty), d = Math.min(10, Math.max(5, Math.hypot(tx - e.x, ty - e.y) + 2));
  shot(g, e, e.x, e.y, a, { ...AXE, speed: 8, range: d, dmg: D(110) });
  for (const o of [-1, 1]) shot(g, e, e.x, e.y, a + o * deg(14), { ...CRESCENT, speed: 6, range: 8, dmg: D(90) });
  later(e, d / 8, 'axeBack', { x: e.x + Math.cos(a) * d, y: e.y + Math.sin(a) * d });
  swish(g); w0pose(g, e, 0.25);

}
function axeBack(g, e, V) { shot(g, e, V.x, V.y, angleTo(V.x, V.y, e.x, e.y), { ...AXE, speed: 7, range: Math.hypot(e.x - V.x, e.y - V.y) + 1, dmg: D(110) }); }
function comboDone(g, e, V) { done(g, e, V.rec, V.mv); }
function moveSet(g, e, V) { setMove(g, e, V.mv, V.t); }
// a leap: its landing ring told (he crouches), then he leaps, lands crushing; a spiral out of it; embers round it
function leapMark(g, e, V) {
  const [x, y] = landing(g, e, V[0], V[1]), T = V.tell || 1.0, w = W(g, e);
  zone(g, e, x, y, 2.8, T + 0.6, 0, ['#ff3a1a', '#ff8a1f']);
  w.prep = g.t + T; setMove(g, e, 'hold', T);

function draw(g) {

// ---- the panel: each boss's state, the log, the measure
let moved = [], lastPos = new Map();

  }
  lines.push(`\nportals ${g.enemies.filter((q) => !q.dead && q.id === 'wiz_portal').length}  all shots ${g.projectiles.length}\ndamage you took, last 60 s: ${dmg}`);

// ---- the loop
let acc = 0, last = performance.now(), pt = 0;

    acc += real * +$('spd').value; const dt = 1 / 60;
    while (acc >= dt) {

fit(); loadSprites(ATLASES).then(() => { start('both'); requestAnimationFrame(frame); });
