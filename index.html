<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="game"></canvas>
    <div id="banner" class="hidden"></div>
    <div id="fade"></div>
    <div id="seals" class="hidden"></div>
    <div id="hud"><span class="h-fame" title="Account fame">✦ <b id="hfame">0</b></span><span class="h-gold" title="Gold">● <b id="hgold">0</b></span><span class="h-ess" title="Essence">◆ <b id="hess">0</b></span></div>
    <div id="chat"><div id="chatlog" aria-live="polite"></div><input id="chatin" class="hidden" maxlength="160" autocomplete="off" spellcheck="false" placeholder="Say something, or /help for commands"></div>
  </main>
  <aside id="panel" data-tab="inv">
    <div id="miniwrap">
      <canvas id="minimap" width="360" height="360"></canvas>
      <div id="minibtns"><button id="miniIn" title="Zoom in (+)">+</button><button id="miniOut" title="Zoom out (−)">−</button></div>
      <span id="minilabel"></span>
    </div>
    <div id="iconrow"><button data-t="stats" data-icon="stats" title="Stats"></button><button data-t="pet" data-icon="pet" title="Pet"></button><span class="sp"></span><button id="gear" data-icon="gear" title="Settings (Esc)" aria-label="Settings"></button></div>
    <div class="bar xp"><i id="xpfill"></i><b><span class="bl" id="xplabel">Lvl</span><span class="bv" id="xptext"></span></b></div>
    <div class="bar hp"><i id="hpfill"></i><b><span class="bl">HP</span><span class="bv" id="hptext"></span></b></div>
    <div class="bar mp"><i id="mpfill"></i><b><span class="bl">MP</span><span class="bv" id="mptext"></span></b></div>
    <div id="equipbox"><div id="equip" class="slots"></div></div>
    <div id="invbox">
      <div id="stattabs"><button data-t="inv" data-pg="0" data-icon="bag" title="Backpack"></button><button data-t="inv" data-pg="1" data-icon="pouch" title="Second backpack (a Pilgrim's Satchel opens it)"></button></div>
      <div id="tabbody"><div id="inv" class="slots"></div><div id="stats"></div></div>
      <div id="pots" class="slots pots"></div>
    </div>
    <div id="bottom">
      <div id="nearby">
        <div id="where"></div>
        <div id="who"><span class="np me"><canvas id="portrait" width="44" height="44"></canvas><span id="cname"></span></span><span class="np" id="petname"></span></div>
        <small id="clevel" class="hidden"></small>
        <div id="quests" class="hidden"></div>
      </div>
      <div id="interact">
        <div id="groundwrap" class="off">
          <div class="label"><span id="groundlabel">Bag</span><button id="baglootall" class="btn sm off">Take all</button><button id="bagportal" class="btn sm off">Enter portal</button></div>
          <div id="ground" class="slots"></div>
        </div>
        <div id="portalwrap" class="off">
          <div class="label" id="portalkind">Portal</div>
          <div class="portalcard"><div class="pi"><b id="portalname"></b><small id="portalsub"></small></div><button id="portalgo" class="btn">Enter</button></div>
        </div>
      </div>
    </div>
    <div id="keys" class="hidden"></div>
  </aside>
</div>
<div id="tooltip" class="hidden"></div>
<div id="overlay" class="hidden"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
